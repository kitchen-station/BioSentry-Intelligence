# Local development database. The password below is for this dev container only, bound to loopback:
# never reuse it anywhere else. `make db-up` starts it and waits until it is healthy.
name: biosentry

services:
  postgres:
    # PostgreSQL 18 (current major), pinned by digest. To upgrade: pull the new tag, copy its digest.
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: biosentry
      POSTGRES_PASSWORD: biosentry-dev-only
      POSTGRES_DB: biosentry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - biosentry-pgdata:/var/lib/postgresql # the 18 image keeps its data in a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biosentry -d biosentry"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  biosentry-pgdata:
