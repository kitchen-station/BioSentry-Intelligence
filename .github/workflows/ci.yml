name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Job ids and `name:` values are the required-check names. Branch protection
# binds to them: do not rename. No `paths:` filters, so required checks never
# end up skipped.
#
# Not covered:
#   - npm audit: reported by the `audit` job but never gating (known highs in
#     react-router 7.6.3, source-map-js). Do not add it to required checks.

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make web-install
      - run: make web-typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make web-install
      - run: make web-build

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make web-install
      - run: make web-lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make web-install
      - run: make web-test

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same PostgreSQL as compose.yaml (keep the digest in step). The password is for this
    # throwaway CI container only.
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: biosentry
          POSTGRES_PASSWORD: biosentry-dev-only
          POSTGRES_DB: biosentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biosentry -d biosentry"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      BIOSENTRY_DATABASE_URL: postgresql://biosentry:biosentry-dev-only@localhost:5432/biosentry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make api-install
      - run: make api-test

  # The research package's own tests (research/README.md, RESEARCH-GATE): they run in the backend's
  # environment and import the backend's NEWS2 and baseline code, so a backend change can break them.
  # The backend job does not collect them.
  research:
    name: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/backend/src:${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make api-install
      - run: uv run python -m pytest -q -p no:cacheprovider ../research/tests
        working-directory: backend

  # The two images the team server builds (deploy/setup.sh). No other job builds them: a Dockerfile
  # or an ignore file that drifts from the code is seen here, not on the server.
  image-api:
    name: image-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag biosentry-api .

  # The web image holds the dashboard and the ward simulator, so its build needs the simulator's
  # repository beside this one, at its default branch as deploy/setup.sh takes it. A change there
  # that breaks this build fails this job: that is the same break the server would meet.
  image-web:
    name: image-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kitchen-station/biosentry-ward-sim
          path: biosentry-ward-sim
          persist-credentials: false
      - run: >-
          docker build --file deploy/web.Dockerfile
          --build-context frontend=frontend
          --build-context sim=biosentry-ward-sim
          --tag biosentry-web deploy

  audit:
    name: audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: frontend

  # The one check to require. Add every new required job to `needs`;
  # only informational jobs (audit) stay out. Nothing checks this: do it by hand.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [typecheck, build, lint, test, backend, research, image-api, image-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded (skipped, cancelled and failed all fail)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
