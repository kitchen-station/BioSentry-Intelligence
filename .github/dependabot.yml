# Weekly dependency PRs; each one runs the full CI (ci-gate) before anyone merges it.
# Exact pins are kept: "increase" bumps the pinned version, never adds ^ or ~.
# shortcut: pip is left out because backend/constraints.txt pins the transitive closure and
# Dependabot would bump pyproject.toml without it; add it once constraints are regenerated in CI.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/frontend", "/frontend/contracts"]
    schedule: { interval: weekly }
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
