# Public mode (deploy/README.md, "Public mode"): what changes in the stack when the team's address is
# opened to the internet. deploy/setup.sh adds this file to compose.yaml only when PUBLIC_HOST is set
# in deploy/.env; without it the stack is exactly the private one.
#
# This file publishes nothing. The public door is `tailscale funnel` on the host, to the same loopback
# port (127.0.0.1:8080) the private door uses, so the database, the API, the ward runner and the lab
# worker stay where they were.
services:
  api:
    environment:
      # The two public sites that may call this API from a browser, and no other origin.
      BIOSENTRY_CORS_ORIGINS: https://biosentry-dashboard.pages.dev,https://biosentry-ward-sim.pages.dev
      # Watching the ward without a sign-in (owner decision S-3, and for the public address on 2026-11-14,
      # "for now") is off unless deploy/.env holds the separate line BIOSENTRY_PUBLIC_OPEN_WARD_VIEW=true.
      # The plain BIOSENTRY_OPEN_WARD_VIEW of .env or the shell is not read here, so it can never turn the
      # public view on by accident. What a visitor sees: deploy/README.md, "Public mode".
      BIOSENTRY_OPEN_WARD_VIEW: ${BIOSENTRY_PUBLIC_OPEN_WARD_VIEW:-false}
    # The API writes one line for each request: capped, so a flood of requests cannot fill the disk
    # with log lines. The audit table in the database is not capped (README, "What does not").
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
