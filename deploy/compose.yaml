# The team deployment on one server: PostgreSQL, the API, the ward simulator, the lab worker, the two
# question workers and the web server that carries the two browser apps. Run from this directory or with
# `-f deploy/compose.yaml`; deploy/setup.sh does it. Secrets come from deploy/.env (git-ignored,
# made by setup.sh): a missing one stops compose with an error, there are no defaults.
#
# Nothing here listens on the public interface. PostgreSQL publishes no port at all and sits on an
# internal network. The web server and the API are published on the host's loopback only
# (127.0.0.1:8080 and 127.0.0.1:8000): teammates reach the web server through `tailscale serve` on
# the host. Keep these ports closed in the server's firewall too: a port Docker publishes on 0.0.0.0
# goes around ufw, which is why two are bound to loopback and the third is not published.
name: biosentry-deploy

services:
  postgres:
    # The same image as the root compose.yaml (keep the digest in step).
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_USER: biosentry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: biosentry
    volumes:
      - pgdata:/var/lib/postgresql # the 18 image keeps its data in a versioned subdirectory
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biosentry -d biosentry"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      # The build only (uv sync): the host's outbound network, because a host firewall that drops
      # forwarded traffic leaves build containers with none. The running API needs no outbound access.
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIOSENTRY_ENV: production
      BIOSENTRY_DATABASE_URL: postgresql://biosentry:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/biosentry
      BIOSENTRY_INGEST_KEY: ${BIOSENTRY_INGEST_KEY:?set BIOSENTRY_INGEST_KEY in deploy/.env}
      # Origins the dashboard is served from, comma-separated; empty keeps the local defaults.
      BIOSENTRY_CORS_ORIGINS: ${BIOSENTRY_CORS_ORIGINS:-}
      # Days of sim time a run keeps its bins and superseded observations; empty keeps the default, 7.
      BIOSENTRY_RETENTION_DAYS: ${BIOSENTRY_RETENTION_DAYS:-}
      # `true` lets anyone who can open the address watch the ward simulator without signing in (bed
      # colours, staff figures, no names). Empty or `false` is off, and the route then does not exist.
      # Never `true` on a public address: compose.public.yaml forces it off and setup.sh refuses both.
      BIOSENTRY_OPEN_WARD_VIEW: ${BIOSENTRY_OPEN_WARD_VIEW:-}
    ports:
      # Loopback only. API_PORT moves the host side when 8000 is taken (a second stack on one machine).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # `default` is what lets the published port work; `backend` (internal) is how it reaches the
    # database; `labnet` (internal) is where the lab worker and the two question workers find it.
    networks: [default, backend, labnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The ward simulator, headless: it runs the ward all the time and writes it into the API with the
  # ingest key (the one door the API gives it), and reads back what clinicians did. The code is the
  # biosentry-ward-sim repository, a sibling checkout that deploy/setup.sh clones and updates (SIM_DIR
  # moves it) and whose Dockerfile this builds. It publishes no port and has no route to the database:
  # only the API is on its network. While it is live, a browser simulator started with the key is
  # refused (409): there is one ward.
  sim:
    build:
      context: ${SIM_DIR:-../../biosentry-ward-sim}
      # The build only (npm ci), on the host's network, for the reason the api's build is.
      network: host
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BIOSENTRY_API_URL: http://api:8000
      BIOSENTRY_INGEST_KEY: ${BIOSENTRY_INGEST_KEY:?set BIOSENTRY_INGEST_KEY in deploy/.env}
      # The speed a new ward starts at, in simulated seconds per second: 1, 10 or 60. The runner exits
      # on anything else. A ward it resumes from its saved state keeps the speed it was saved at; a
      # clinician who may (an md or the charge nurse) changes it from the viewer afterwards.
      WARD_SPEED: ${WARD_SPEED:-1}
      # Where it keeps its state across restarts (the simstate volume).
      WARD_STATE_FILE: /state/ward-state.json
    volumes:
      - simstate:/state

  # The lab worker: it runs the simulated compare runs a clinician asks for on the dashboard's
  # Simulation lab page. It claims a request from the API with the ingest key, runs the simulator's own
  # compare, and posts the result back (docs/lab-worker.md in the simulator's repository). The same
  # image as `sim`, with another command. It publishes no port and sits on an internal network with
  # the API alone: no route out, none to the database. Nothing is kept: it writes only under /tmp,
  # which is in memory. It refuses to start if a proxy variable is set, so give it none.
  lab:
    build:
      context: ${SIM_DIR:-../../biosentry-ward-sim}
      # The build only (npm ci), on the host's network, for the reason the api's build is.
      network: host
    command: ["node", "dist/lab/lab-worker.js"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BIOSENTRY_API_URL: http://api:8000
      BIOSENTRY_INGEST_KEY: ${BIOSENTRY_INGEST_KEY:?set BIOSENTRY_INGEST_KEY in deploy/.env}
    networks: [labnet]
    read_only: true
    # The one place it may write (one compare run's two files at a time), in memory and capped.
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Bounds for a run that goes wrong, so it cannot take the database's memory: the 30-day hospital
    # run peaked near 200 MB and 25 processes and threads.
    mem_limit: 1g
    pids_limit: 128
    cpus: 2

  # The patient question worker: it answers "Ask about this patient" on the dashboard's patient page.
  # It claims one question from the API with the ingest key, answers it by code from the patient data
  # that the API froze into the job, and posts the answer back (research/README.md, "The patient
  # agent"). No language model. It publishes no port and sits on the internal network with the API
  # alone: no route out, none to the database. It writes no file at all, so it has no writable place
  # (but Docker's own in-memory /dev/shm and /dev/mqueue, as every container has).
  # It follows no redirect and uses no proxy, so the key goes to the API host only.
  ask-patient:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
      target: worker
      # The build only (uv sync), on the host's network, for the reason the api's build is.
      network: host
    command: ["python", "-m", "research.patient_agent", "worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BIOSENTRY_API_URL: http://api:8000
      BIOSENTRY_INGEST_KEY: ${BIOSENTRY_INGEST_KEY:?set BIOSENTRY_INGEST_KEY in deploy/.env}
    networks: [labnet]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # One small job at a time, in memory: measured near 30 MB.
    mem_limit: 256m
    pids_limit: 64
    cpus: 1

  # The lab question worker: it answers the Ask page of the lab (a question about the whole simulated
  # ward). It claims one question, runs one of three fixed experiments on stored simulator trials, and
  # posts the answer back (research/README.md, "The question worker"). Keyword rules choose the
  # experiment. The same image and the same isolation as `ask-patient`. Two folders:
  #   /trials      read-only: the trial root. Copy `ward-v2/seed-01` to `seed-10` (18 MB) into
  #                deploy/agent-trials/ward-v2/ on the server once (AGENT_TRIALS_DIR moves it). No
  #                held-out seed belongs there. While the folder is empty every question ends as
  #                failed with "the agent's tool failed"; nothing else breaks.
  #   /agent-home  the agent's own ledger of what it ran (the agenthome volume). Nothing else is
  #                writable but /tmp, which is in memory (and Docker's /dev/shm and /dev/mqueue).
  # deploy/compose.tuned.yaml adds the tuned model for the questions the rules are silent on.
  ask-lab:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
      target: worker
      # The build only (uv sync), on the host's network, for the reason the api's build is.
      network: host
    command: ["python", "-m", "research.agent", "worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BIOSENTRY_API_URL: http://api:8000
      BIOSENTRY_INGEST_KEY: ${BIOSENTRY_INGEST_KEY:?set BIOSENTRY_INGEST_KEY in deploy/.env}
      BIOSENTRY_AGENT_TRIALS: /trials
      BIOSENTRY_AGENT_HOME: /agent-home
    volumes:
      - ${AGENT_TRIALS_DIR:-./agent-trials}:/trials:ro
      - agenthome:/agent-home
    networks: [labnet]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # One experiment at a time: measured near 16 s and 210 MB for one question on 2 CPUs.
    mem_limit: 1g
    pids_limit: 128
    cpus: 2

  # The address the team opens: the dashboard at /, the full ward simulator at /simulator/ and the API at /api,
  # from one small web server (web.Dockerfile, Caddyfile). The pages call the API on their own address,
  # so there is no cross-origin request and no API address to bake into them. Like the api it is
  # published on the host's loopback only (WEB_PORT moves the host side); `tailscale serve` on the
  # host is what lets the team in. It holds no secret and has no route to the database, and it
  # answers 404 for /api/sim/*: the ingest door is not reachable from here.
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
      additional_contexts:
        frontend: ../frontend
        sim: ${SIM_DIR:-../../biosentry-ward-sim}
      # The build only (npm ci), on the host's network, for the reason the api's build is.
      network: host
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    read_only: true
    # The one place caddy may write (its instance id and locks), in memory.
    tmpfs: [/tmp]
    environment:
      XDG_DATA_HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  backend:
    internal: true # no route out, and nothing outside reaches it
  labnet:
    internal: true # the API, the lab worker and the two question workers only

volumes:
  pgdata:
  simstate:
  agenthome:
